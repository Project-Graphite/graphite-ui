name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: project-graphite/actions/.github/workflows/reusable-package-release.yml@main
    with:
      release: true
